---
- name: Verify Docker on DevSecOps server
  hosts: devsecops
  become: true
  gather_facts: true

  tasks:

    - name: Check Docker service
      ansible.builtin.systemd:
        name: docker
      register: docker_service

    - name: Display Docker service status
      ansible.builtin.debug:
        msg: "Docker service state: {{ docker_service.status.ActiveState }}"

    - name: Check Docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        var: docker_version.stdout


- name: Verify containerd on Kubernetes servers
  hosts: kubernetes
  become: true
  gather_facts: true

  tasks:

    - name: Check containerd service
      ansible.builtin.systemd:
        name: containerd
      register: containerd_service

    - name: Display containerd service status
      ansible.builtin.debug:
        msg: "containerd state: {{ containerd_service.status.ActiveState }}"

    - name: Check containerd version
      ansible.builtin.command: containerd --version
      register: containerd_version
      changed_when: false

    - name: Display containerd version
      ansible.builtin.debug:
        var: containerd_version.stdout